name: CI

on:
  push:
    branches: ["main", "debug/CI_issues"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: '0 0 * * 0'

jobs:
  unit-tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Install LD-Chem with test dependencies
        run: |
          python -m pip install -e ".[test]"

      - name: Run tests with coverage
        run: |
          python -m pytest --cov=src/ld_chem --cov-config=.coveragerc --cov-report=xml --cov-report=term-missing

  integration-tests:
    name: Integration tests (main & PRs only)
    runs-on: ubuntu-latest
    needs: unit-tests
    if: ${{ github.ref == 'refs/heads/main' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build, test, and integration dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build pytest

      - name: Build and install LD-Chem
        run: |
          python -m build
          python -m pip install dist/*.whl

      - name: Run integration tests
        run: |
          python -m pytest tests/integration
